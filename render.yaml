services:
  - type: web
    name: mindvault-ebook
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mindvault-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: COMMUNITY_URL
        value: https://ecellcup.onrender.com/community

databases:
  - name: mindvault-db
    databaseName: mindvault
    user: mindvault_admin
    region: oregon
    plan: free
